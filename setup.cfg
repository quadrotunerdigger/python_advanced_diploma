[flake8]
max-line-length = 88
extend-ignore = E203, E266, E501, W503, D100, D104, D107
per-file-ignores =
    __init__.py: F401, D104
    tests/*: D103, D100
    app/models/follower.py: E402
    app/models/like.py: E402
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    *.egg-info,
    migrations/versions/*

[isort]
profile = black
line_length = 88
known_first_party = app
known_third_party = fastapi,pydantic,sqlalchemy,alembic,pytest
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
skip = .git,__pycache__,.venv,venv,build,dist,migrations/versions

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

[coverage:run]
source = app
branch = True
omit =
    */tests/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
    if __name__ == .__main__.:
show_missing = True
precision = 2

[coverage:html]
directory = htmlcov

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
follow_imports = silent
ignore_missing_imports = True

[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-migrations.*]
ignore_errors = True

[bandit]
exclude_dirs = tests,migrations
skips = B101